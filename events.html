   <span id="sec"></span>:<span id="timer"></span>



    <script>

        let count = 0
        let flag = false
        let myinterval
        let sec=0

        function timer() {
            if (!flag) {
                myinterval = setInterval(caltimer, 100)
                flag = true
            }
            else {
                clearInterval(myinterval)
                flag=false
            }
        }
        function caltimer() {
            count++
            document.getElementById("timer").innerHTML = count;
            if(count==10)
        {
            sec++;
            document.getElementById("sec").innerHTML=sec
            count=0
        }
        }
