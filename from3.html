<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    <div class="container mt-4">
        <div class="card p-2">
            <h2 class="text-center m-2">Registation form</h2>
            <form onsubmit="return register()" name="RegisterForm"> 
                <div class="row">

                    <div class="col-lg-6">
                        <div class="form-group px-3" id="FirstName">
                           <div class="fs-5 p-2"><label for="FirstName">First Name</label> <span class="error float-end text-danger"> </span></div>
                            <input type="text" class="form-control" name="Fname" id="Fname">
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="form-group px-3">
                            <div class="fs-5 p-2"><label for="LastName">Last Name</label> <span class="error float-end text-danger"></span></div>
                            <input type="text" class="form-control" name="Lname" id="LastName">
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="form-group px-3">
                            <div class="fs-5 p-2"><label for="Email">Email Address</label> <span class="error float-end text-danger"> </span></div>
                            <input type="email" class="form-control" name="Email" id="Email">
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="form-group px-3">
                            <div class="fs-5 p-2"><label for="Phone">Phone</label> <span class="error float-end text-danger"> </span></div>
                            <input type="tel" class="form-control" name="Phone" id="Phone">
                        </div>
                    </div>
                    <div class="col-lg-12">
                        <div class="d-grid gap-2 px-3 m-4">
                            <button class="btn btn-success" type="submit">Save</button>
                           
                          </div>
                    </div>
                </div>
            
            </form>
        </div>
    </div>

    <script>
         const error=document.getElementsByClassName("error")
        function register(){
            let validate=true
            clearError();
            const myForm= document.forms["RegisterForm"]

            const divname= myForm["FirstName"].value
            console.log(divname);
            
           
            if(myForm["Fname"].value=="" || myForm["Fname"].value.length<4) 
                {
                    error[0].innerHTML="Name is requird"
                    validate= false;
                }

                if(myForm["Lname"].value=="")
                {
                    error[1].innerHTML="Last name is requird"
                    validate= false;
                }
            
            return validate
        }


        function seterror(id, msg)
        {

        }


        function clearError()
            {
                for(let i of error)
                   i.innerHTML=" "
                    

            }
            


    </script>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
