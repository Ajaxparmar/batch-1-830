<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Design</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        body {
           background-image: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470");
           
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            background-color: #f5f5f5;
             
        }

        .form-control {
            background-color: rgb(231, 218, 199);
            color: white;
            border: none;
        }

       

        .form-div {
            position: relative;
        }

        .form-div i {
            position: absolute;
            right: 5%;
            top: 42px;
            visibility: hidden;
        }

        .form-div small {
            visibility: hidden;
            color: #e74c3c;
            position: absolute;
        }

        .form-div small.error {
            visibility: visible;
        }

        .form-div.success i.fa-circle-check {
            color: #2ecc71;
            visibility: visible;
        }

        .form-div.error i.fa-exclamation-circle {
            color: #e74c3c;
            visibility: visible;
        }
    </style>
</head>

<body>

    <div class="container ">
        <div class="form-container p-5">
            <h1 class="text-center pb-3">Registration Form</h1>
            <form class="form" id="form">
                <div class="mb-3 form-div ">
                    <label class="form-label">First Name:</label>
                    <input type="text" class="form-control" id="fname" placeholder="Enter your first name">
                    <i class="fa-solid fa-circle-check"></i>
                    <i class="fa-solid fa-exclamation-circle"></i>
                    <small>ERROR MSG</small>
                </div>
                <div class="mb-3 form-div">
                    <label class="form-label">Last Name:</label>
                    <input type="text" class="form-control" id="lname">
                    <i class="fa-solid fa-circle-check"></i>
                    <i class="fa-solid fa-exclamation-circle"></i>
                    <small>ERROR MSG</small>
                </div>
                <div class="mb-3 form-div">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email">
                    <i class="fa-solid fa-circle-check"></i>
                    <i class="fa-solid fa-exclamation-circle"></i>
                    <small>ERROR MSG</small>
                </div>
                <div class="mb-3 form-div">
                    <label class="form-label">Password:</label>
                    <input type="password" class="form-control" id="password">
                    <i class="fa-solid fa-circle-check"></i>
                    <i class="fa-solid fa-exclamation-circle"></i>
                    <small>ERROR MSG</small>
                </div>
                <div class="mb-3 form-div">
                    <label class="form-label">Phone No:</label>
                    <input type="tel" class="form-control" id="Phone">
                    <i class="fa-solid fa-circle-check"></i>
                    <i class="fa-solid fa-exclamation-circle"></i>
                    <small>ERROR MSG</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date & Time:</label>
                    <input type="datetime-local" class="form-control">
                </div>

                <button type="submit" class="btn btn-warning w-100">Submit</button>

            </form>

        </div>
    </div>
    <script>

        const form = document.getElementById("form");
        const fname = document.getElementById("fname");
        const lname = document.getElementById("lname");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const phone = document.getElementById("Phone");

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            validate();
        });

        function validate() {
            let fnameVal = fname.value.trim();
            let lnameVal = lname.value.trim();
            let emailVal = email.value.trim();
            let passwordVal = password.value.trim();
            let phoneVal = phone.value.trim();

            if (fnameVal === "") {
                setError(fname, "First name cannot be blank");
            } else if (fnameVal.length < 3) {
                setError(fname, "Minimum 3 characters");
            } else {
                setSuccess(fname);
            }

            if (lnameVal === "") {
                setError(lname, "Last name cannot be blank");
            } else {
                setSuccess(lname);
            }

            if (emailVal === "") {
                setError(email, "Email cannot be blank");
            } else if (!isEmail(emailVal)) {
                setError(email, "Not a valid email");
            } else {
                setSuccess(email);
            }

            if (passwordVal === "") {
                setError(password, "Password cannot be blank");
            } else if (passwordVal.length < 6) {
                setError(password, "Min 6 characters");
            } else {
                setSuccess(password);
            }

            if (phoneVal === "") {
                setError(phone, "Phone cannot be blank");
            } else if (phoneVal.length !== 10) {
                setError(phone, "Enter 10 digit number");
            } else {
                setSuccess(phone);
            }
        }

        function setError(input, message) {
            const formDiv = input.parentElement;
            const small = formDiv.querySelector("small");

            formDiv.classList.add("error");
            formDiv.classList.remove("success");

            small.innerText = message;
            small.style.visibility = "visible";
        }

        function setSuccess(input) {
            const formDiv = input.parentElement;
            const small = formDiv.querySelector("small");

            formDiv.classList.add("success");
            formDiv.classList.remove("error");

            small.style.visibility = "hidden";
        }


    </script>

</body>

</html>
